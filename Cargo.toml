[package]
name = "onchain-core"
version = "0.1.0"
edition = "2024"
description = "Shared plumbing for on-chain bots: RPC pool, head and Flashblocks streams, eth_simulateV1, keystore signing, broadcast, shared nonce, executor actor, send gates"
license = "AGPL-3.0-or-later"
repository = "https://github.com/foodpenguin/bot-onchain-core"
publish = false

[dependencies]
alloy = { version = "2.5.0", features = ["full", "json-rpc", "signer-local", "signer-keystore"] }
anyhow = "1.0.104"
brotli = "8"
futures = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls"] }
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["full"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
toml = "1.1.8"
tower = { version = "0.5", default-features = false }
tracing = "0.1.44"

[dev-dependencies]
rand = "0.8"
alloy = { version = "2.5.0", features = ["full", "json-rpc", "signer-local", "signer-keystore", "node-bindings"] }
